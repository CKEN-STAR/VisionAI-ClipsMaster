model:
  name: mistral-12b-nemo-en
  display_name: Mistral-Nemo-12B 英文剧本重构模型
  language: en
  version: '2407'
  model_format: huggingface
  hf_model_id: mistralai/Mistral-Nemo-Instruct-2407
  modelscope_id: AI-ModelScope/Mistral-Nemo-Instruct-2407
  parameters: 12B
  size_fp16: 24GB
paths:
  base: models/mistral/mistral-12b-nemo
  quantized: models/mistral/mistral-12b-nemo/quantized
  adapters: models/mistral/mistral-12b-nemo/adapters
  checkpoint: models/mistral/mistral-12b-nemo/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  advanced_tier:
    r: 16
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  advanced_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    fp16: true
    gradient_checkpointing: true
hardware_requirements:
  advanced_tier:
    min_vram: 6GB
    recommended_vram: 8GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 3s
download:
  modelscope_url: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Nemo-Instruct-2407
  hf_mirror_url: https://hf-mirror.com/mistralai/Mistral-Nemo-Instruct-2407
  hf_url: https://huggingface.co/mistralai/Mistral-Nemo-Instruct-2407
  quantized_versions:
    fp16: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Nemo-Instruct-2407
  resume_download: true
  max_retries: 3
  timeout: 600
剧本重构配置:
  max_input_length: 12000
  max_output_length: 3000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
benchmark:
  device: GPU (NVIDIA RTX 3050 8GB)
  quantization: FP16
  inference_time_per_subtitle: 2.5s
  memory_usage: 8.2GB
  bleu_score: 0.75
changelog:
- version: '2.0'
  date: '2025-10-23'
  changes:
  - 移除GPTQ量化支持，专注于FP16训练
  - 优化下载逻辑，从服务器动态获取文件大小
  - 增强下载中断清理机制
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持进阶级设备
  - 支持LoRA微调
