model:
  name: mistral-24b-small-en
  display_name: Mistral-Small-3.1-24B 英文剧本重构模型（支持多模态）
  language: en
  version: '2503'
  model_format: huggingface
  hf_model_id: mistralai/Mistral-Small-3.1-24B-Instruct-2503
  modelscope_id: AI-ModelScope/Mistral-Small-3.1-24B-Instruct-2503
  parameters: 24B
  size_fp16: 48GB
  supports_vision: true
paths:
  base: models/mistral/mistral-24b-small
  quantized: models/mistral/mistral-24b-small/quantized
  adapters: models/mistral/mistral-24b-small/adapters
  checkpoint: models/mistral/mistral-24b-small/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  high_tier:
    r: 32
    lora_alpha: 128
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  high_tier:
    learning_rate: 3e-4
    batch_size: 8
    gradient_accumulation_steps: 2
    num_epochs: 3
    max_seq_length: 8192
    warmup_steps: 100
    fp16: true
    gradient_checkpointing: true
hardware_requirements:
  high_tier:
    min_vram: 10GB
    recommended_vram: 12GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 2s
download:
  modelscope_url: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Small-Instruct-2409
  hf_mirror_url: https://hf-mirror.com/mistralai/Mistral-Small-Instruct-2409
  hf_url: https://huggingface.co/mistralai/Mistral-Small-Instruct-2409
  quantized_versions:
    fp16: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Small-Instruct-2409
  resume_download: true
  max_retries: 3
  timeout: 900
剧本重构配置:
  max_input_length: 16000
  max_output_length: 4000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
benchmark:
  device: GPU (NVIDIA RTX 3060 12GB)
  quantization: FP16
  inference_time_per_subtitle: 1.6s
  memory_usage: 12.5GB
  bleu_score: 0.78
changelog:
- version: '2.0'
  date: '2025-10-23'
  changes:
  - 移除GPTQ量化支持，专注于FP16训练
  - 优化下载逻辑，从服务器动态获取文件大小
  - 增强下载中断清理机制
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持中高级设备
  - 支持多模态（视觉+文本）
  - 支持LoRA微调
