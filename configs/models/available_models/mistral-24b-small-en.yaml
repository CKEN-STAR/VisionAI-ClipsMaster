model:
  name: mistral-24b-small-en
  display_name: Mistral-Small-3.1-24B 英文剧本重构模型（支持多模态）
  language: en
  version: '2503'
  model_format: gptq
  hf_model_id: mistralai/Mistral-Small-3.1-24B-Instruct-2503
  modelscope_id: AI-ModelScope/Mistral-Small-3.1-24B-Instruct-2503
  parameters: 24B
  size_fp16: 48GB
  size_int4: 12GB
  size_int8: 24GB
  supports_vision: true
paths:
  base: models/mistral/mistral-24b-small
  quantized: models/mistral/mistral-24b-small/quantized
  adapters: models/mistral/mistral-24b-small/adapters
  checkpoint: models/mistral/mistral-24b-small/base/model.safetensors
quantization:
  default_level: INT4
  emergency_level: INT4
  performance_level: INT4
  gptq_config:
    bits: 4
    group_size: 128
    desc_act: false
lora_config:
  high_tier:
    r: 32
    lora_alpha: 128
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  high_tier:
    learning_rate: 3e-4
    batch_size: 8
    gradient_accumulation_steps: 2
    num_epochs: 3
    max_seq_length: 8192
    warmup_steps: 100
    fp16: true
    gradient_checkpointing: true
hardware_requirements:
  high_tier:
    min_vram: 10GB
    recommended_vram: 12GB
    device_type: GPU
    quantization: INT4
    estimated_inference_time: 2s
download:
  modelscope_url: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Small-Instruct-2409
  hf_mirror_url: https://hf-mirror.com/mistralai/Mistral-Small-Instruct-2409
  hf_url: https://huggingface.co/mistralai/Mistral-Small-Instruct-2409
  quantized_versions:
    int4: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
    int4_128: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
    int4_perchannel: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
    int8: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
    int8_128: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
    int8_perchannel: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
  resume_download: true
  max_retries: 3
  timeout: 900
  mirror_sources:
    int4:
      primary: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
      mirror: https://hf-mirror.com/LoneStriker/Mistral-Small-Instruct-2409-4.0bpw-h6-exl2
      official: https://huggingface.co/LoneStriker/Mistral-Small-Instruct-2409-4.0bpw-h6-exl2
    int8:
      primary: https://www.modelscope.cn/models/LoneStriker/Mistral-Small-Instruct-2409-GPTQ
      mirror: https://hf-mirror.com/LoneStriker/Mistral-Small-Instruct-2409-8.0bpw-h8-exl2
      official: https://huggingface.co/LoneStriker/Mistral-Small-Instruct-2409-8.0bpw-h8-exl2
剧本重构配置:
  max_input_length: 16000
  max_output_length: 4000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
benchmark:
  device: GPU (NVIDIA RTX 3060 12GB)
  quantization: INT4
  inference_time_per_subtitle: 1.6s
  memory_usage: 10.5GB
  bleu_score: 0.78
changelog:
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持中高级设备
  - 支持多模态（视觉+文本）
