model:
  name: qwen2.5-32b-zh
  display_name: Qwen2.5-32B 中文剧本重构模型
  language: zh
  version: '2.5'
  model_format: gptq
  hf_model_id: Qwen/Qwen2.5-32B-Instruct
  modelscope_id: qwen/Qwen2.5-32B-Instruct
  parameters: 32B
  size_fp16: 64.0GB
  size_int4: 16.0GB
  size_int8: 32.0GB
paths:
  base: models/qwen/qwen2.5-32b
  quantized: models/qwen/qwen2.5-32b/quantized
  adapters: models/qwen/qwen2.5-32b/adapters
  checkpoint: models/qwen/qwen2.5-32b/base/model.safetensors
quantization:
  default_level: INT4
  emergency_level: INT4
  performance_level: INT4
  gptq_config:
    bits: 4
    group_size: 128
    desc_act: false
lora_config:
  flagship_tier:
    r: 64
    lora_alpha: 256
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  flagship_tier:
    learning_rate: 2e-4
    batch_size: 16
    gradient_accumulation_steps: 1
    num_epochs: 3
    max_seq_length: 16384
    warmup_steps: 100
    fp16: true
    gradient_checkpointing: true
hardware_requirements:
  flagship_tier:
    min_vram: 20GB
    recommended_vram: 24GB
    device_type: GPU
    quantization: INT4
    estimated_inference_time: 1.5s
download:
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct
  hf_mirror_url: https://hf-mirror.com/Qwen/Qwen2.5-32B-Instruct
  hf_url: https://huggingface.co/Qwen/Qwen2.5-32B-Instruct
  quantized_versions:
    int4: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
    int4_128: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
    int4_perchannel: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
    int8: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
    int8_128: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
    int8_perchannel: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
  resume_download: true
  max_retries: 3
  timeout: 1200
  mirror_sources:
    int4:
      primary: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
      mirror: https://hf-mirror.com/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
      official: https://huggingface.co/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int4
    int8:
      primary: https://www.modelscope.cn/models/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      mirror: https://hf-mirror.com/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
      official: https://huggingface.co/Qwen/Qwen2.5-32B-Instruct-GPTQ-Int8
剧本重构配置:
  max_input_length: 32000
  max_output_length: 8000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
benchmark:
  device: GPU (NVIDIA RTX 4090 24GB)
  quantization: INT4
  inference_time_per_subtitle: 1.2s
  memory_usage: 18GB
  bleu_score: 0.85
changelog:
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持旗舰级设备
