# VisionAI-ClipsMaster 全局模型配置
# 更新时间：2025-10-23（GPTQ弃用 + FP16训练 + GGUF推理）
#
# 重要更新（2025-10-23）：
# 1. ⚠️ GPTQ量化已弃用：不再支持GPTQ量化模型用于训练
# 2. ✅ 推荐工作流程：FP16训练 → GGUF推理
# 3. 训练阶段：下载FP16原始模型 → 使用LoRA微调
# 4. 推理阶段：将训练后的模型转换为GGUF格式（INT4/INT8量化）
#
# 最新更新（2025-01-31）：
# 1. 模型系列：全面升级到Qwen3系列（qwen3-0.6b, qwen3-1.7b, qwen3-8b, qwen3-32b）
# 2. Qwen3优势：更好的指令遵循能力、更强的中文理解、更好的输出格式控制
# 3. 参数量提升：0.5B→0.6B (+20%), 1.5B→1.7B (+13%), 7B→8B (+14%)
#
# 历史更新（2025-10-07）：
# 1. 模型系列：Qwen2.5系列（qwen2.5-0.5b, qwen2.5-1.5b, qwen2.5-3b, qwen2.5-7b, qwen2.5-14b, qwen2.5-32b）
# 2. 量化配置：INT8-128, INT4-128, INT8-PerChannel, INT4-PerChannel（仅用于GGUF推理）
# 3. 硬件评分系统：从5级离散分级升级到0-100分连续评分

# 智能推荐模式（新增）
intelligent_recommendation:
  enabled: true  # 启用智能推荐
  auto_detect_device: true  # 自动检测设备
  auto_select_model: true  # 自动选择模型
  fallback_to_manual: true  # 检测失败时回退到手动选择

# 当前激活的模型（智能推荐模式下会自动更新）
active_models:
  chinese: qwen3-0.6b-zh  # 默认使用最小模型，实际会根据设备自动调整
  english: mistral-7b-en  # 默认使用7B模型，实际会根据设备自动调整

# 可用模型列表（Qwen3系列）
available_models:
  chinese:
    - qwen3-0.6b-zh      # 入门级设备（硬件评分0-35分）
    - qwen3-1.7b-zh      # 进阶级设备（硬件评分35-55分）
    - qwen3-8b-zh        # 中高级设备（硬件评分55-75分）
    - qwen3-32b-zh       # 旗舰级设备（硬件评分75-100分）
  english:
    - mistral-7b-en
    - mistral-12b-nemo-en
    - mistral-24b-small-en
    - mistral-large2-en

# 设备分级规则（更新：基于连续硬件评分0-100分）
# 注意：实际推荐由intelligent_model_selector.py的calculate_hardware_score()动态计算
device_tiers:
  entry:
    name: "入门级"
    hardware_score_range: [0, 35]
    min_memory_gb: 3
    max_memory_gb: 4
    device_type: "CPU"
    recommended_models:
      chinese: qwen2.5-0.5b-zh
      english: mistral-7b-en
    quantization: "INT4-128"

  basic:
    name: "基础级"
    hardware_score_range: [35, 45]
    min_vram_gb: 3
    max_vram_gb: 4
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-0.5b-zh
      english: mistral-7b-en
    quantization: "INT4-128"

  advanced:
    name: "进阶级"
    hardware_score_range: [45, 55]
    min_vram_gb: 4
    max_vram_gb: 6
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-1.5b-zh
      english: mistral-12b-nemo-en
    quantization: "INT4-128"

  mid:
    name: "中级"
    hardware_score_range: [55, 65]
    min_vram_gb: 6
    max_vram_gb: 8
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-3b-zh
      english: mistral-12b-nemo-en
    quantization: "INT4-PerChannel"

  high:
    name: "中高级"
    hardware_score_range: [65, 75]
    min_vram_gb: 8
    max_vram_gb: 12
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-7b-zh
      english: mistral-24b-small-en
    quantization: "INT4-PerChannel"

  advanced_high:
    name: "高级"
    hardware_score_range: [75, 85]
    min_vram_gb: 12
    max_vram_gb: 18
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-14b-zh
      english: mistral-24b-small-en
    quantization: "INT4-128"

  flagship:
    name: "旗舰级"
    hardware_score_range: [85, 100]
    min_vram_gb: 20
    max_vram_gb: 40
    device_type: "GPU"
    recommended_models:
      chinese: qwen2.5-32b-zh
      english: mistral-large2-en
    quantization: "INT8-PerChannel"

# 量化配置（仅用于GGUF推理，不用于训练）
# ⚠️ 注意：这些量化配置仅用于将训练后的模型转换为GGUF格式进行推理
# 训练阶段使用FP16原始模型 + LoRA微调
quantization:
  default: "INT4-128"  # 默认量化等级（GGUF推理）
  low_memory: "INT4-128"  # 低内存模式（GGUF推理）
  high_performance: "INT4-PerChannel"  # 高性能模式（GGUF推理，精度优先）

  # 量化策略（仅用于GGUF推理）
  strategies:
    # INT8-128：8bit量化，group_size=128（平衡模式）
    INT8-128:
      quantization_type: "int8"
      group_size: 128
      memory_reduction: 0.50  # 相比FP16减少50%
      precision_loss: 0.05  # 精度损失约5%
      use_case: "平衡模式"
      quality_retention: 0.95
      inference_speed_factor: 0.85

    # INT4-128：4bit量化，group_size=128（速度优先）
    INT4-128:
      quantization_type: "int4"
      group_size: 128
      memory_reduction: 0.75  # 相比FP16减少75%
      precision_loss: 0.10  # 精度损失约10%
      use_case: "低配设备，速度优先"
      quality_retention: 0.90
      inference_speed_factor: 0.80

    # INT8-PerChannel：8bit per-channel量化（高精度）
    INT8-PerChannel:
      quantization_type: "q8_0"
      group_size: -1  # per-channel
      memory_reduction: 0.50  # 相比FP16减少50%
      precision_loss: 0.04  # 精度损失约4%
      use_case: "高精度模式"
      quality_retention: 0.96
      inference_speed_factor: 0.83

    # INT4-PerChannel：4bit per-channel量化（精度优先）
    INT4-PerChannel:
      quantization_type: "q4_k_m"
      group_size: -1  # per-channel
      memory_reduction: 0.75  # 相比FP16减少75%
      precision_loss: 0.08  # 精度损失约8%
      use_case: "低配设备，精度优先"
      quality_retention: 0.92
      inference_speed_factor: 0.75

    # 兼容旧配置
    INT4:
      quantization_type: "int4"
      group_size: 128
      memory_reduction: 0.75
      precision_loss: 0.10
      use_case: "低配设备（兼容旧配置）"
      quality_retention: 0.90
      inference_speed_factor: 0.80

    INT8:
      quantization_type: "int8"
      group_size: 128
      memory_reduction: 0.50
      precision_loss: 0.05
      use_case: "平衡模式（兼容旧配置）"
      quality_retention: 0.95
      inference_speed_factor: 0.85

# 性能配置（更新）
performance:
  max_threads: 4
  batch_size: 2
  use_gpu: true  # 优先使用GPU
  auto_detect_gpu: true  # 自动检测GPU

  # 内存优化
  memory_optimization:
    gradient_checkpointing: true  # 梯度检查点（节省40%显存）
    dynamic_quantization: true  # 动态量化
    model_offloading: false  # 模型卸载（暂不启用）

# 下载配置（新增）
download:
  # 镜像源优先级
  mirror_priority:
    - modelscope  # 国内镜像（优先）
    - hf_mirror  # HuggingFace镜像
    - huggingface  # 官方源

  # 下载设置
  resume_download: true  # 断点续传
  max_retries: 3  # 最大重试次数
  timeout: 600  # 超时时间（秒）
  verify_checksum: true  # 校验哈希值

  # 缓存设置
  cache_dir: "models/.cache"
  auto_cleanup: false  # 自动清理旧版本

# 训练配置（新增）
training:
  enabled: true
  use_lora: true  # 使用LoRA微调
  auto_config: true  # 自动配置训练参数

  # 默认训练参数（会根据设备等级自动调整）
  default_params:
    learning_rate: 3e-4
    num_epochs: 3
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100

# 日志配置
logging:
  level: "INFO"
  log_model_loading: true
  log_inference: true
  log_training: true
  log_device_detection: true
