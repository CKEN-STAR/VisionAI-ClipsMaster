model:
  name: qwen2.5-0.5b-zh
  display_name: Qwen2.5-0.5B 中文剧本重构模型
  language: zh
  version: '2.5'
  model_format: gptq
  hf_model_id: Qwen/Qwen2.5-0.5B-Instruct
  modelscope_id: qwen/Qwen2.5-0.5B-Instruct
  parameters: 0.5B
  size_fp16: 1.0GB
  size_int4: 0.25GB
  size_int8: 0.5GB
paths:
  base: models/qwen/qwen2.5-0.5b
  quantized: models/qwen/qwen2.5-0.5b/quantized
  adapters: models/qwen/qwen2.5-0.5b/adapters
  checkpoint: models/qwen/qwen2.5-0.5b/base/model.safetensors
quantization:
  default_level: INT8
  emergency_level: INT4
  performance_level: INT8
  gptq_config:
    bits: 4
    group_size: 128
    desc_act: false
    sym: true
    true_sequential: true
  llm_int8_config:
    load_in_8bit: true
    llm_int8_threshold: 6.0
    llm_int8_skip_modules: null
lora_config:
  entry_tier:
    r: 4
    lora_alpha: 16
    target_modules:
    - q_proj
    - v_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
  basic_tier:
    r: 8
    lora_alpha: 32
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  entry_tier:
    learning_rate: 3e-4
    batch_size: 1
    gradient_accumulation_steps: 8
    num_epochs: 3
    max_seq_length: 2048
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: false
    bf16: false
    gradient_checkpointing: true
  basic_tier:
    learning_rate: 3e-4
    batch_size: 2
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 2048
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  entry_tier:
    min_memory: 3GB
    recommended_memory: 4GB
    device_type: CPU
    quantization: INT8
    estimated_inference_time: 10s
  basic_tier:
    min_vram: 3GB
    recommended_vram: 4GB
    device_type: GPU
    quantization: INT4
    estimated_inference_time: 5s
download:
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct
  hf_mirror_url: https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct
  hf_url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct
  quantized_versions:
    int4: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
    int4_128: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
    int4_perchannel: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
    int8: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
    int8_128: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
    int8_perchannel: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
  resume_download: true
  max_retries: 3
  timeout: 300
  mirror_sources:
    int4:
      primary: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      mirror: https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
      official: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int4
    int8:
      primary: https://www.modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
      mirror: https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
      official: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GPTQ-Int8
剧本重构配置:
  max_input_length: 8000
  max_output_length: 2000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
  user_prompt_template: '原片字幕如下：

    {original_srt}


    请根据以上原片字幕，生成一个吸引人的混剪视频字幕。要求：

    1. 提取最精彩的片段

    2. 确保剧情连贯

    3. 生成新的SRT格式字幕文件

    4. 字幕长度控制在原片的{min_ratio}到{max_ratio}之间

    '
benchmark:
  device: CPU (Intel i5-10400)
  quantization: INT8
  inference_time_per_subtitle: 8.5s
  memory_usage: 3.2GB
  bleu_score: 0.72
  device_gpu: GPU (NVIDIA GTX 1650 4GB)
  quantization_gpu: INT4
  inference_time_per_subtitle_gpu: 4.2s
  memory_usage_gpu: 2.8GB
  bleu_score_gpu: 0.74
known_issues:
- CPU模式下推理速度较慢，建议使用GPU
- INT4量化可能导致精度略有下降，但在可接受范围内
- 长字幕（>8000字符）可能需要分段处理
changelog:
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持入门级和基础级设备
  - 支持INT4/INT8量化
  - 支持LoRA/QLoRA微调
