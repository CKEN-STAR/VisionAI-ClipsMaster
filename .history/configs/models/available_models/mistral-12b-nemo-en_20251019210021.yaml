model:
  name: mistral-12b-nemo-en
  display_name: Mistral-Nemo-12B 英文剧本重构模型
  language: en
  version: '2407'
  model_format: gptq
  hf_model_id: mistralai/Mistral-Nemo-Instruct-2407
  modelscope_id: AI-ModelScope/Mistral-Nemo-Instruct-2407
  parameters: 12B
  size_fp16: 24GB
  size_int4: 6GB
  size_int8: 12GB
paths:
  base: models/mistral/mistral-12b-nemo
  quantized: models/mistral/mistral-12b-nemo/quantized
  adapters: models/mistral/mistral-12b-nemo/adapters
  checkpoint: models/mistral/mistral-12b-nemo/base/model.safetensors
quantization:
  default_level: INT4
  emergency_level: INT4
  performance_level: INT4
  gptq_config:
    bits: 4
    group_size: 128
    desc_act: false
lora_config:
  advanced_tier:
    r: 16
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  advanced_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    fp16: true
    gradient_checkpointing: true
hardware_requirements:
  advanced_tier:
    min_vram: 6GB
    recommended_vram: 8GB
    device_type: GPU
    quantization: INT4
    estimated_inference_time: 3s
download:
  modelscope_url: https://www.modelscope.cn/models/AI-ModelScope/Mistral-Nemo-Instruct-2407
  hf_mirror_url: https://hf-mirror.com/mistralai/Mistral-Nemo-Instruct-2407
  hf_url: https://huggingface.co/mistralai/Mistral-Nemo-Instruct-2407
  quantized_versions:
    int4: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
    int4_128: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
    int4_perchannel: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
    int8: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
    int8_128: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
    int8_perchannel: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
  resume_download: true
  max_retries: 3
  timeout: 600
  mirror_sources:
    int4:
      primary: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
      mirror: https://hf-mirror.com/LoneStriker/Mistral-Nemo-Instruct-2407-4.0bpw-h6-exl2
      official: https://huggingface.co/LoneStriker/Mistral-Nemo-Instruct-2407-4.0bpw-h6-exl2
    int8:
      primary: https://www.modelscope.cn/models/LoneStriker/Mistral-Nemo-Instruct-2407-GPTQ
      mirror: https://hf-mirror.com/LoneStriker/Mistral-Nemo-Instruct-2407-8.0bpw-h8-exl2
      official: https://huggingface.co/LoneStriker/Mistral-Nemo-Instruct-2407-8.0bpw-h8-exl2
剧本重构配置:
  max_input_length: 12000
  max_output_length: 3000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
benchmark:
  device: GPU (NVIDIA RTX 3050 8GB)
  quantization: INT4
  inference_time_per_subtitle: 2.5s
  memory_usage: 6.2GB
  bleu_score: 0.75
changelog:
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持进阶级设备
