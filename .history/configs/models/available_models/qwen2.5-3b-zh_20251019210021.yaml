剧本重构配置:
  max_input_length: 12000
  max_output_length: 3000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
benchmark:
  device: GPU (NVIDIA RTX 3060 8GB)
  quantization: INT4-128
  inference_time_per_subtitle: 2.5s
  memory_usage: 6.8GB
  bleu_score: 0.78
  device_high_precision: GPU (NVIDIA RTX 3060 8GB)
  quantization_high_precision: INT4-PerChannel
  inference_time_per_subtitle_high: 2.8s
  memory_usage_high: 6.9GB
  bleu_score_high: 0.79
known_issues:
- 需要至少6GB显存才能流畅运行
- INT4量化在复杂剧情分析时可能略有精度损失
- 建议使用INT4-PerChannel获得更好的质量
changelog:
- version: '1.0'
  date: '2025-10-07'
  changes:
  - 初始版本
  - 新增模型，填补1.7B和8B之间的空白
  - 支持4种量化配置（INT8-128, INT4-128, INT8-PerChannel, INT4-PerChannel）
  - 适用于中级设备（硬件评分55-65分）
  - 支持LoRA/QLoRA微调
