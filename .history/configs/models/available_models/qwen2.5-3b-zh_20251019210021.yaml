    group_size: 128
    desc_act: false
    sym: true
    true_sequential: true
  llm_int8_config:
    load_in_8bit: true
    llm_int8_threshold: 6.0
    llm_int8_skip_modules: null
lora_config:
  mid_tier:
    r: 16
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  mid_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 2
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  mid_tier:
    min_vram: 6GB
    recommended_vram: 8GB
    device_type: GPU
    quantization: INT4-128
    estimated_inference_time: 3s
    hardware_score_range:
    - 55
    - 65
