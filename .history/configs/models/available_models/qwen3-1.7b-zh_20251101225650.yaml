# ============================================================================
# Qwen3-1.7B 中文剧本重构模型配置
# ============================================================================
#
# 工作流程说明：
# 1. Track 1（训练轨道）：
#    - model_format: huggingface 表示下载HuggingFace原始模型
#    - 格式：FP16/BF16（完整精度）
#    - 用途：模型训练、LoRA微调
#    - 仓库：Qwen/Qwen3-1.7B（HuggingFace）
#
# 2. Track 2（推理轨道）：
#    - 使用GGUF量化模型（由HF模型转换而来）
#    - 格式：GGUF（量化格式）
#    - 用途：生产环境的高效推理
#    - 转换流程：HF模型 → 合并LoRA → 转GGUF → 量化
#    - 转换工具：models/converters/model_converter.py
#
# ============================================================================

model:
  name: qwen3-1.7b-zh
  display_name: Qwen3-1.7B 中文剧本重构模型
  language: zh
  version: '3.0'
  model_format: huggingface  # 下载HuggingFace原始模型（用于训练）
  hf_model_id: Qwen/Qwen3-1.7B
  modelscope_id: qwen/Qwen3-1.7B
  parameters: 1.7B
  size_fp16: auto  # 动态获取，不再硬编码
paths:
  base: models/qwen/qwen3-1.7b
  quantized: models/qwen/qwen3-1.7b/quantized
  adapters: models/qwen/qwen3-1.7b/adapters
  checkpoint: models/qwen/qwen3-1.7b/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  advanced_tier:
    r: 16
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  advanced_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  advanced_tier:
    min_vram: 6GB
    recommended_vram: 8GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 2.5s
download:
  # 🔧 多源下载策略（从高到低）：
  # 1. ModelScope（阿里云镜像，国内高速且稳定，推荐首选）
  # 2. AI快站（HuggingFace镜像加速，国内高速备用）
  # 3. HuggingFace官方（国外源，作为最后保障）
  # 注意：HF-Mirror已移除（大文件重定向到不可访问的CDN）
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen3-1.7B
  aifasthub_url: https://aifasthub.com/Qwen/Qwen3-1.7B
  hf_url: https://huggingface.co/Qwen/Qwen3-1.7B
  # 下载源优先级顺序
  source_priority:
    - modelscope   # 优先：阿里云镜像（国内高速且稳定）
    - aifasthub    # 备用1：AI快站（HuggingFace镜像加速）
    - huggingface  # 备用2：官方源（国外源，作为最后保障）
  # 使用snapshot_download下载整个模型仓库（支持多源自动切换）
  use_snapshot_download: true
  resume_download: true
  max_retries: 3
  timeout: 300
剧本重构配置:
  max_input_length: 12000
  max_output_length: 3000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
  user_prompt_template: '原片字幕如下：

    {original_srt}


    请根据以上原片字幕，生成一个吸引人的混剪视频字幕。要求：

    1. 提取最精彩的片段

    2. 确保剧情连贯

    3. 生成新的SRT格式字幕文件

    4. 字幕长度控制在原片的{min_ratio}到{max_ratio}之间

    '
benchmark:
  device: GPU (NVIDIA RTX 3050 8GB)
  quantization: FP16
  inference_time_per_subtitle: 2.5s
  memory_usage: 7.5GB
  bleu_score: 0.78
known_issues:
- 需要至少6GB显存用于FP16训练
changelog:
- version: '1.0'
  date: '2025-01-31'
  changes:
  - 初始版本（Qwen3系列）
  - 支持进阶级设备
  - 支持LoRA微调
  - 更好的指令遵循能力
  - 更强的中文理解能力
  - 更好的输出格式控制

