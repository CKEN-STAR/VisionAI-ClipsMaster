model:
  name: qwen3-0.6b-zh
  display_name: Qwen3-0.6B 中文剧本重构模型
  language: zh
  version: '3.0'
  model_format: huggingface
  hf_model_id: Qwen/Qwen3-0.6B
  modelscope_id: qwen/Qwen3-0.6B
  parameters: 0.6B
  size_fp16: auto  # 动态获取，不再硬编码
paths:
  base: models/qwen/qwen3-0.6b
  quantized: models/qwen/qwen3-0.6b/quantized
  adapters: models/qwen/qwen3-0.6b/adapters
  checkpoint: models/qwen/qwen3-0.6b/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  entry_tier:
    r: 4
    lora_alpha: 16
    target_modules:
    - q_proj
    - v_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
  basic_tier:
    r: 8
    lora_alpha: 32
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  entry_tier:
    learning_rate: 5e-4
    batch_size: 2
    gradient_accumulation_steps: 8
    num_epochs: 3
    max_seq_length: 2048
    warmup_steps: 50
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
  basic_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  entry_tier:
    min_vram: 2GB
    recommended_vram: 4GB
    device_type: CPU/GPU
    quantization: FP16
    estimated_inference_time: 2s
  basic_tier:
    min_vram: 4GB
    recommended_vram: 6GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 1.5s
download:
  # 🔧 多源下载策略（从高到低）：
  # 1. HF-Mirror（国内高速镜像，推荐首选）
  # 2. ModelScope（阿里云镜像，备用）
  # 3. HuggingFace官方（永不失效，最后保障）
  hf_mirror_url: https://hf-mirror.com/Qwen/Qwen3-0.6B
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen3-0.6B
  hf_url: https://huggingface.co/Qwen/Qwen3-0.6B
  # 下载源优先级顺序
  source_priority:
    - hf_mirror   # 优先：国内高速镜像（hf-mirror.com）
    - modelscope  # 备用：阿里云镜像
    - huggingface # 最后：官方源（永不失效）
  # 使用snapshot_download下载整个模型仓库（支持多源自动切换）
  use_snapshot_download: true
  resume_download: true
  max_retries: 3
  timeout: 300
剧本重构配置:
  max_input_length: 8000
  max_output_length: 2000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
  user_prompt_template: '原片字幕如下：

    {original_srt}


    请根据以上原片字幕，生成一个吸引人的混剪视频字幕。要求：

    1. 提取最精彩的片段

    2. 确保剧情连贯

    3. 生成新的SRT格式字幕文件

    4. 字幕长度控制在原片的{min_ratio}到{max_ratio}之间

    '
benchmark:
  device: CPU (Intel i5-8250U)
  quantization: FP16
  inference_time_per_subtitle: 3.5s
  memory_usage: 2.5GB
  bleu_score: 0.72
known_issues:
- 适合入门级设备，性能有限
- 建议使用CPU推理
changelog:
- version: '1.0'
  date: '2025-01-31'
  changes:
  - 初始版本（Qwen3系列）
  - 支持入门级设备
  - 支持LoRA微调
  - 更好的指令遵循能力
  - 更强的中文理解能力

