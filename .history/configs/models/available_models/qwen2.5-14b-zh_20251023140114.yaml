model:
  name: qwen2.5-14b-zh
  display_name: Qwen2.5-14B 中文剧本重构模型
  language: zh
  version: '2.5'
  model_format: huggingface
  hf_model_id: Qwen/Qwen2.5-14B-Instruct
  modelscope_id: qwen/Qwen2.5-14B-Instruct
  parameters: 14B
  size_fp16: 28.0GB
paths:
  base: models/qwen/qwen2.5-14b
  quantized: models/qwen/qwen2.5-14b/quantized
  adapters: models/qwen/qwen2.5-14b/adapters
  checkpoint: models/qwen/qwen2.5-14b/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  high_tier:
    r: 32
    lora_alpha: 128
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  high_tier:
    learning_rate: 2e-4
    batch_size: 8
    gradient_accumulation_steps: 2
    num_epochs: 3
    max_seq_length: 8192
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  high_tier:
    min_vram: 14GB
    recommended_vram: 18GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 1.5s
    hardware_score_range:
    - 75
    - 85
download:
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen2.5-14B-Instruct
  hf_mirror_url: https://hf-mirror.com/Qwen/Qwen2.5-14B-Instruct
  hf_url: https://huggingface.co/Qwen/Qwen2.5-14B-Instruct
  quantized_versions:
    fp16: https://www.modelscope.cn/models/Qwen/Qwen2.5-14B-Instruct
  resume_download: true
  max_retries: 3
  timeout: 900
剧本重构配置:
  max_input_length: 16000
  max_output_length: 4000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
benchmark:
  device: GPU (NVIDIA RTX 4070 Ti 16GB)
  quantization: INT4-128
  inference_time_per_subtitle: 1.3s
  memory_usage: 15.5GB
  bleu_score: 0.82
  device_high_precision: GPU (NVIDIA RTX 4070 Ti 16GB)
  quantization_high_precision: INT8-PerChannel
  inference_time_per_subtitle_high: 1.5s
  memory_usage_high: 17.2GB
  bleu_score_high: 0.84
known_issues:
- 需要至少14GB显存才能流畅运行
- 推荐使用RTX 4070 Ti或更高级别的显卡
changelog:
- version: '2.0'
  date: '2025-10-23'
  changes:
  - 移除GPTQ量化支持，专注于FP16训练
  - 优化下载逻辑，从服务器动态获取文件大小
  - 增强下载中断清理机制
- version: '1.0'
  date: '2025-10-07'
  changes:
  - 初始版本
  - 新增模型，填补8B和32B之间的空白
  - 适用于高级设备（硬件评分75-85分）
  - 提供更高的剧本重构质量
  - 支持LoRA微调
