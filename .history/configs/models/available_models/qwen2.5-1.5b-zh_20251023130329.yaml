model:
  name: qwen2.5-1.5b-zh
  display_name: Qwen2.5-1.5B 中文剧本重构模型
  language: zh
  version: '2.5'
  model_format: huggingface
  hf_model_id: Qwen/Qwen2.5-1.5B-Instruct
  modelscope_id: qwen/Qwen2.5-1.5B-Instruct
  parameters: 1.5B
  size_fp16: 3.0GB
paths:
  base: models/qwen/qwen2.5-1.5b
  quantized: models/qwen/qwen2.5-1.5b/quantized
  adapters: models/qwen/qwen2.5-1.5b/adapters
  checkpoint: models/qwen/qwen2.5-1.5b/base/model.safetensors
quantization:
  default_level: FP16
  emergency_level: FP16
  performance_level: FP16
lora_config:
  advanced_tier:
    r: 16
    lora_alpha: 64
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    lora_dropout: 0.05
    bias: none
    task_type: CAUSAL_LM
training:
  advanced_tier:
    learning_rate: 3e-4
    batch_size: 4
    gradient_accumulation_steps: 4
    num_epochs: 3
    max_seq_length: 4096
    warmup_steps: 100
    logging_steps: 10
    save_steps: 100
    eval_steps: 100
    fp16: true
    bf16: false
    gradient_checkpointing: true
hardware_requirements:
  advanced_tier:
    min_vram: 6GB
    recommended_vram: 8GB
    device_type: GPU
    quantization: FP16
    estimated_inference_time: 3s
download:
  modelscope_url: https://www.modelscope.cn/models/Qwen/Qwen2.5-1.5B-Instruct
  hf_mirror_url: https://hf-mirror.com/Qwen/Qwen2.5-1.5B-Instruct
  hf_url: https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct
  quantized_versions:
    fp16: https://www.modelscope.cn/models/Qwen/Qwen2.5-1.5B-Instruct
  resume_download: true
  max_retries: 3
  timeout: 300
剧本重构配置:
  max_input_length: 12000
  max_output_length: 3000
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  min_output_ratio: 0.2
  max_output_ratio: 0.8
  system_prompt: '你是一个专业的短剧剪辑师，擅长从原片字幕中提取精彩片段，重新组织成吸引人的混剪视频字幕。

    你的任务是：

    1. 理解原片的剧情走向和情感曲线

    2. 提取最精彩、最吸引人的片段

    3. 重新组织这些片段，确保剧情连贯、情感递进

    4. 生成新的字幕文件，包含时间码和对话内容


    注意事项：

    - 保持剧情连贯性，避免跳跃过大

    - 确保情感曲线合理，有起承转合

    - 避免过短（剧情不完整）或过长（与原片相差不大）

    - 优先选择冲突、转折、高潮等关键情节

    '
  user_prompt_template: '原片字幕如下：

    {original_srt}


    请根据以上原片字幕，生成一个吸引人的混剪视频字幕。要求：

    1. 提取最精彩的片段

    2. 确保剧情连贯

    3. 生成新的SRT格式字幕文件

    4. 字幕长度控制在原片的{min_ratio}到{max_ratio}之间

    '
benchmark:
  device: GPU (NVIDIA RTX 3050 8GB)
  quantization: INT4
  inference_time_per_subtitle: 2.8s
  memory_usage: 5.5GB
  bleu_score: 0.76
known_issues:
- 需要至少6GB显存
- INT4量化精度略有下降，但整体表现良好
changelog:
- version: '1.0'
  date: '2025-01-06'
  changes:
  - 初始版本
  - 支持进阶级设备
  - 支持INT4量化
  - 支持QLoRA微调
