# VisionAI-ClipsMaster Docker Compose Configuration
# Complete service orchestration for production deployment

version: '3.8'

services:
  # ============================================
  # Main Application Service
  # ============================================
  visionai-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: visionai-clipsmaster
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8080:8080"
      - "5000:5000"
    volumes:
      # Persistent data volumes
      - ./models:/app/models
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./cache:/app/cache
      # Temporary volumes for processing
      - visionai-temp:/tmp
    environment:
      - PYTHONPATH=/app
      - DISPLAY=:99
      - QT_QPA_PLATFORM=offscreen
      - MPLBACKEND=Agg
      - CUDA_VISIBLE_DEVICES=""
      - TORCH_HOME=/app/cache/torch
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://visionai:visionai123@postgres:5432/visionai
    depends_on:
      - redis
      - postgres
    networks:
      - visionai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Redis Cache Service
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: visionai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - visionai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: visionai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=visionai
      - POSTGRES_USER=visionai
      - POSTGRES_PASSWORD=visionai123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - visionai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionai -d visionai"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Celery Worker Service
  # ============================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: visionai-celery-worker
    restart: unless-stopped
    command: celery -A src.core.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./cache:/app/cache
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TORCH_HOME=/app/cache/torch
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
    depends_on:
      - redis
      - postgres
    networks:
      - visionai-network

  # ============================================
  # Celery Beat Scheduler Service
  # ============================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: visionai-celery-beat
    restart: unless-stopped
    command: celery -A src.core.celery_app beat --loglevel=info
    volumes:
      - ./logs:/app/logs
      - celery-beat-data:/app/celerybeat-schedule
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - visionai-network

  # ============================================
  # Nginx Reverse Proxy Service
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: visionai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./static:/app/static
    depends_on:
      - visionai-app
    networks:
      - visionai-network

# ============================================
# Network Configuration
# ============================================
networks:
  visionai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Volume Configuration
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  celery-beat-data:
    driver: local
  visionai-temp:
    driver: local
